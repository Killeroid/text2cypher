[project]
name = "text2cypher"
version = "3.0.0"
description = "text2cypher: Generate validated Cypher queries from natural language text with LLMs"
readme = "README.md"
authors = [
    { name = "Kwaku Yeboah-Antwi" }
]
requires-python = ">=3.12"
dependencies = [
    "cypher-guardrail>=1.5.1",
    "falkordb[hiredis]>=1.8.0",
    "openai>=3.31.0",
    "redis>=8.1.0",
    "snowballstemmer>=3.1.1",
]
keywords = ["cypher", "text2cypher", "falkordb", "llm", "knowledge-graph", "openCypher", "graphdb"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Typing :: Typed",
]
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES"]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "text2cypher"

[dependency-groups]
dev = [
    "anyio>=4.15.1",
    "coverage>=7.16.2",
    "falkordblite; python_version >= '3.12'",
    "httpx2>=2.13.1",
    "import-linter>=2.15",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.1",
    "sphinx-copybutton>=0.5.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the embedded FalkorDB server (skip with -m \"not db\")"]
# importlib mode (recommended for new projects) lets test files in different folders share a name
addopts = ["--import-mode=importlib", "--strict-markers"]
# so that the tests can import the trial harness in evals/ and the helpers in tests/support.py
pythonpath = [".", "tests"]

[tool.coverage.run]
branch = true
source = ["text2cypher", "evals"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
src = ["src", "."]

[tool.ruff.lint]
extend-select = ["B", "I", "UP", "SIM", "C4", "C90", "PTH", "RET", "RUF", "ASYNC", "PT", "TID", "TC", "FURB"]

[tool.ruff.lint.mccabe]
# A function this complex is doing more than one thing: split it
max-complexity = 10

[tool.importlinter]
root_packages = ["text2cypher", "evals"]

# Each layer may use the ones below it, never the ones above: the entry point uses the loop,
# the loop uses generation and validation, and those use the LLM protocol and the schema.
[[tool.importlinter.contracts]]
name = "The layers of the package"
type = "layers"
layers = [
    "text2cypher._pipeline | text2cypher.skills",
    "text2cypher._workflow",
    "text2cypher._generation | text2cypher._graph",
    "text2cypher._results",
    "text2cypher._validation",
    "text2cypher.llm | text2cypher.schema | text2cypher._config | text2cypher._errors | text2cypher._skills",
]

[[tool.importlinter.contracts]]
name = "The package does not use the trial harness"
type = "forbidden"
source_modules = ["text2cypher"]
forbidden_modules = ["evals"]

[tool.ty.environment]
python = ".venv"


[project.urls]
Homepage = "https://github.com/Killeroid/text2cypher"
Documentation = "https://text2cypher.readthedocs.io/en/stable/"
Changelog = "https://github.com/Killeroid/text2cypher/blob/main/CHANGELOG.md"
Issues = "https://github.com/Killeroid/text2cypher/issues"
Repository = "https://github.com/Killeroid/text2cypher"
